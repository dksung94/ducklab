<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ducklab</title>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/vendor/codemirror.css">
<link rel="stylesheet" href="/static/vendor/cm-dracula.css">
<style>
:root{color-scheme:light dark;--bg:#f6f5f1;--card:#ffffff;--ink:#1c1e21;--muted:#6a6f76;--rule:#e3e0d8;
 --accent:#3a5a46;--accent-ink:#fff;--err:#a6392f;--busy:#8a641c;--code:#f0eee8;--ok:#3a8a5e;--stale:#b8860b}
@media (prefers-color-scheme:dark){:root{--bg:#101211;--card:#181b19;--ink:#e8eae6;--muted:#8b918b;
 --rule:#262a27;--accent:#7fae8f;--accent-ink:#10130f;--err:#e0857d;--busy:#d9b45c;--code:#141614;--ok:#7fae8f;--stale:#d9b45c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;
 background:var(--bg);border-bottom:1px solid var(--rule)}
.top .name{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:14px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}
.top .spacer{flex:1}
.top .status{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.top .iconbtn{padding:6px 9px}
.dot{width:9px;height:9px;border-radius:50%;background:#b33;flex:none}
.dot.on{background:var(--accent)}
button{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--card);color:var(--ink);
 border-radius:8px;padding:6px 12px;cursor:pointer;transition:background .12s}
button:hover{background:var(--code)}
button.primary:hover{background:var(--accent);filter:brightness(1.08)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:active{transform:translateY(1px)}
.wrap{max-width:880px;margin:0 auto;padding:14px 12px 90px}
.cell{background:var(--card);border:1px solid var(--rule);border-radius:12px;margin:12px 0;overflow:visible;position:relative}
.cell.busy{border-color:var(--busy)}
.cell.ok{box-shadow:inset 3px 0 0 var(--ok)}
.cell.err{box-shadow:inset 3px 0 0 var(--err)}
.cell.stale{box-shadow:inset 3px 0 0 var(--stale)}
.cell.sel{outline:2px solid var(--accent);outline-offset:1px}
.chead .stalebadge{display:none;font-size:10px;color:var(--stale);border:1px solid var(--stale);border-radius:5px;padding:0 6px;flex:none}
.cell.stale .stalebadge{display:inline-block}
#addcell{display:flex;justify-content:center;margin:8px 0 24px}
#addcell button{display:flex;align-items:center;gap:7px;border:1px dashed var(--rule);background:var(--card);
 color:var(--muted);border-radius:999px;padding:8px 18px;font-size:13px;transition:all .14s}
#addcell button:hover{color:var(--accent);border-color:var(--accent);border-style:solid;
 background:color-mix(in srgb,var(--accent) 8%,transparent)}
#addcell .plus{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
 border-radius:50%;border:1.5px solid currentColor;font-size:14px;line-height:1}
.cell.sel .chead{background:color-mix(in srgb,var(--accent) 7%,transparent)}
#help{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
#help.open{display:flex}
#help .card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px 22px;width:min(520px,92vw);max-height:84vh;overflow:auto}
#help h3{margin:0 0 12px;font-size:16px}
#help table{width:100%;border-collapse:collapse;font-size:13px}
#help td{padding:5px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
#help td:first-child{white-space:nowrap;width:1%}
#help .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:14px}
kbd{font:11.5px ui-monospace,Menlo,monospace;background:var(--code);border:1px solid var(--rule);
 border-bottom-width:2px;border-radius:6px;padding:1px 7px;color:var(--ink)}
.cell.queued{border-color:var(--muted)}
.qspin{font-size:11px;color:var(--muted);padding:0 12px 8px;display:none}
.cell.queued .qspin{display:block}
.spin .stopbtn{margin-left:8px;font-size:11px;padding:1px 8px;color:var(--err);
  border:1px solid var(--err);background:none;border-radius:6px;cursor:pointer}
.spin .stopbtn:hover{background:var(--err);color:#fff}
@keyframes cellflash{0%{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}100%{border-color:var(--rule);box-shadow:none}}
.cell.flash{animation:cellflash 1.6s ease-out}
.chead{display:flex;align-items:center;gap:9px;padding:7px 10px 7px 12px;border-bottom:1px solid var(--rule)}
.chead .idx{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;font-weight:700;color:var(--muted);
 background:var(--code);border:1px solid var(--rule);border-radius:6px;padding:1px 7px;flex:none}
.chead .t{font-size:12.5px;color:var(--ink);font-weight:600;flex:1;font-family:ui-monospace,Menlo,monospace;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .t .ln{color:var(--faint,#999);font-weight:400}
.chead button{padding:3px 11px;font-size:12px;opacity:.85}
.chead button:hover{opacity:1}
.chead .actions{display:flex;gap:8px;opacity:0;transition:opacity .12s}
.cell:hover .actions,.cell.sel .actions,.cell.editing .actions{opacity:1}
@media(hover:none){.chead .actions{opacity:1}}
.cellmenu{position:absolute;right:10px;top:38px;z-index:6;background:var(--card);border:1px solid var(--rule);
 border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.28);padding:5px;min-width:150px;display:none}
.cellmenu.open{display:block}
.cellmenu button{display:flex;width:100%;justify-content:flex-start;gap:8px;border:0;border-radius:7px;
 padding:7px 11px;font-size:12.5px;background:transparent}
.cellmenu button:hover{background:var(--code)}
.cellmenu button.danger{color:var(--err)}
.cellmenu .sep{height:1px;background:var(--rule);margin:4px 2px}
#topmenu{position:absolute;right:96px;top:46px;z-index:16;background:var(--card);border:1px solid var(--rule);
 border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.28);padding:5px;min-width:180px;display:none}
#topmenu.open{display:block}
#topmenu button{display:flex;width:100%;justify-content:flex-start;border:0;border-radius:7px;padding:8px 11px;font-size:12.5px;background:transparent}
#topmenu button:hover{background:var(--code)}
.chead .saved{font-size:11px;color:var(--accent);opacity:0;transition:opacity .15s;flex:none;
 font-weight:600;pointer-events:none}
.chead .saved.on{opacity:1}
.chead .runbadge{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;flex:none}
#memchip{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;white-space:nowrap;display:none}
#memchip.on{display:inline-block}
#runbar{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:30;
 transition:width .25s ease;box-shadow:0 0 8px var(--accent);display:none}
#runbar.on{display:block}
#toast .act{margin-left:12px;color:var(--accent);cursor:pointer;text-decoration:underline;font-weight:600}
pre.code{margin:0;padding:12px 14px;background:var(--code);font-family:ui-monospace,"SF Mono",Menlo,monospace;
 font-size:12.5px;line-height:1.5;overflow-x:auto;white-space:pre;-webkit-overflow-scrolling:touch}
.out{padding:8px 14px 12px;display:none;border-top:1px dashed var(--rule);max-height:360px;overflow:auto}
.out.has{display:block}
.out.expanded{max-height:none}
.outbar{display:none;justify-content:flex-end;gap:6px;padding:4px 12px 0}
.outbar.has{display:flex}
.outbar button{font-size:11px;padding:2px 9px;color:var(--muted)}
.out pre{margin:6px 0;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;
 white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.out pre.err{color:var(--err);border-left:3px solid var(--err);padding-left:10px}
.out img{max-width:100%;border-radius:8px;margin:8px 0;display:block;background:#fff}
.out .rich{overflow-x:auto;margin:6px 0}
.out .rich table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.out .rich td,.out .rich th{border:1px solid var(--rule);padding:3px 9px;text-align:right;white-space:nowrap}
.out .rich th{color:var(--muted);font-weight:600}
.mdrender{display:none;padding:6px 16px 12px;line-height:1.6}
.mdrender h1{font-size:20px;margin:.5em 0 .3em}.mdrender h2{font-size:17px;margin:.5em 0 .3em}.mdrender h3{font-size:15px;margin:.5em 0 .3em}
.mdrender p{margin:.4em 0}.mdrender li{margin-left:1.3em}.mdrender code{background:var(--code);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:.9em}
.mdrender pre{background:var(--code);padding:10px 12px;border-radius:8px;overflow-x:auto}
.cell.mdcell pre.code,.cell.mdcell .askbar,.cell.mdcell .outbar,.cell.mdcell .out,.cell.mdcell [data-run],.cell.mdcell [data-ask]{display:none}
.cell.mdcell .mdrender{display:block}
.cell.mdcell.editing .mdrender{display:none}
/* fold */
.chead .fold{border:0;background:transparent;color:var(--muted);padding:0 4px;font-size:12px;cursor:pointer;flex:none}
.cell.folded pre.code,.cell.folded .out,.cell.folded .outbar,.cell.folded .mdrender,.cell.folded .askbar{display:none}
.cell.folded .fold{transform:rotate(-90deg)}
/* report view: hide code + chrome, keep narrative + outputs */
body.report .chead,body.report #addcell,body.report .outbar,body.report pre.code{display:none}
body.report .cell{border-color:transparent;box-shadow:none}
body.report .cell.mdcell{border:0}
body.report .out{border-top:0}
/* outline + vars in drawer */
#drawer .olist a,#drawer .vlist .vrow{display:block;padding:5px 12px;font:12px ui-monospace,Menlo,monospace;
 color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#drawer .olist a:hover{background:var(--code)}
#drawer .olist a.h2{padding-left:24px;color:var(--muted)}
#drawer .vlist .vrow{color:var(--muted)}
#drawer .vlist .vn{color:var(--ink);font-weight:600}
/* find bar */
#findbar{position:fixed;top:8px;right:14px;z-index:24;display:none;gap:6px;align-items:center;background:var(--card);
 border:1px solid var(--rule);border-radius:9px;padding:5px 8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#findbar.open{display:flex}
#findbar input{border:0;background:transparent;color:var(--ink);font-size:13px;outline:none;width:180px}
#findbar .cnt{font-size:11px;color:var(--muted);min-width:34px;text-align:right}
#findbar button{padding:2px 8px;font-size:12px}
.cell.findhit{outline:2px solid var(--busy);outline-offset:1px}
.spin{font-size:11px;color:var(--busy);padding:0 12px 8px;display:none}
.cell.busy .spin{display:block}
.askbar{display:none;gap:8px;padding:8px 12px;border-top:1px solid var(--rule);align-items:center;background:var(--code)}
.cell.asking .askbar{display:flex}
.askbar input{flex:1;font:13px ui-sans-serif,-apple-system,sans-serif;color:var(--ink);background:var(--card);
 border:1px solid var(--rule);border-radius:8px;padding:7px 11px;min-width:0}
.askbar input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.askbar button{flex:none;padding:6px 13px;font-size:12.5px}
.askbar .hint{flex:none;font-size:10.5px;color:var(--faint)}
#envchip{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;padding:4px 10px;background:transparent;border-color:transparent;color:var(--muted)}
#envchip:hover{background:var(--code);border-color:var(--rule)}
#envmodal{position:fixed;inset:0;z-index:22;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#envmodal.open{display:flex}
#envmodal .panel{background:var(--card);border:1px solid var(--rule);border-radius:14px;width:min(560px,94vw);
 max-height:80vh;overflow:auto;padding:18px 20px}
#envmodal h3{margin:0 0 4px;font-size:15px}
#envmodal .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
#envmodal .erow{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--rule);
 border-radius:9px;margin:6px 0;cursor:pointer}
#envmodal .erow:hover{background:var(--code)}
#envmodal .erow.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
#envmodal .erow .nm{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#envmodal .erow .vv{font-size:11px;color:var(--muted);flex:none}
#envmodal .erow .src{font-size:10px;color:var(--faint);flex:none;border:1px solid var(--rule);border-radius:5px;padding:1px 6px}
#envmodal .addrow{display:flex;gap:8px;margin-top:12px}
#envmodal .addrow input{flex:1;font:12px ui-monospace,Menlo,monospace;color:var(--ink);background:var(--code);
 border:1px solid var(--rule);border-radius:8px;padding:7px 10px;min-width:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);
 font-size:13px;padding:8px 16px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:.92}
@media (prefers-color-scheme:dark){pre.code.cm-s-dracula{background:#282a36}}
@media(max-width:600px){body{font-size:14px}.wrap{padding:10px 8px 80px}pre.code{font-size:11.5px}
 .top{flex-wrap:wrap;row-gap:8px}
 .top .spacer{flex-basis:100%;height:0}
 .top .name{max-width:60vw}
 #memchip{display:none}}
.CodeMirror{height:auto;background:var(--code);color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.5}
.CodeMirror-gutters{background:var(--code);border-right:1px solid var(--rule)}
.CodeMirror-linenumber{color:var(--muted)}
.editbar{display:none;gap:8px;padding:7px 12px;border-top:1px solid var(--rule)}
.cell.editing .editbar{display:flex}
.cell.editing pre.code{display:none}
.cm-holder{display:none}.cell.editing .cm-holder{display:block}
.celltitle{display:none;width:100%;box-sizing:border-box;font:13px ui-monospace,Menlo,monospace;color:var(--ink);
 background:var(--code);border:1px solid var(--rule);border-radius:8px 8px 0 0;border-bottom:0;padding:7px 12px}
.celltitle:focus{outline:none;border-color:var(--accent)}
.cell.editing .celltitle{display:block}
.cell.editing .cm-holder .CodeMirror{border-radius:0 0 6px 6px}
#drawer{position:fixed;top:0;left:0;bottom:0;z-index:15;width:min(320px,85vw);background:var(--card);
 border-right:1px solid var(--rule);transform:translateX(-100%);transition:transform .18s ease;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .dhead{padding:12px 14px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--muted)}
#drawer .dhead b{color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
#drawer .dlist{overflow-y:auto;flex:1;padding:6px}
#drawer a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;
 font:12.5px ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer a:hover{background:var(--code)}
#drawer a.cur{background:var(--accent);color:var(--accent-ink)}
#drawer a .k{font-size:10px;opacity:.7;margin-left:6px}
#drawer .khead{padding:10px 14px 4px;border-top:1px solid var(--rule);font-size:11px;font-weight:700;
 letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#drawer .krow{padding:7px 10px;margin:2px 6px;border:1px solid var(--rule);border-radius:8px;font-size:11.5px}
#drawer .krow .kf{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer .krow .ki{color:var(--muted);margin:3px 0 5px}
#drawer .krow button{padding:2px 9px;font-size:11px;margin-right:6px}
#drawer .krow .dead{color:var(--muted);font-style:italic}
#scrim{position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.35);display:none}
#scrim.open{display:block}
#settings{position:fixed;inset:0;z-index:20;display:none;background:var(--bg)}
#settings.open{display:flex;flex-direction:column}
#settings .phead{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--rule);flex:none}
#settings .phead h3{margin:0;font-size:17px;flex:1}
#settings .pbody{flex:1;overflow-y:auto}
#settings .pin{max-width:760px;margin:0 auto;padding:22px 20px 40px}
#settings .pfoot{flex:none;border-top:1px solid var(--rule);background:var(--card)}
#settings .pfoot .pin{display:flex;gap:10px;align-items:center;padding:12px 20px}
#settings .hint{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.6}
#settings label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin:18px 0 6px}
#settings label .sub{font-weight:400;color:var(--muted)}
#settings input[type=text],#settings textarea{width:100%;font:13px ui-monospace,Menlo,monospace;color:var(--ink);
 background:var(--code);border:1px solid var(--rule);border-radius:9px;padding:9px 12px}
#settings input[type=text]:focus,#settings textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
#settings textarea{min-height:44vh;resize:vertical;line-height:1.55}
#settings .seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;margin:2px 0 8px}
#settings .seg button{border:0;border-radius:0;padding:6px 14px;font-size:12.5px;background:var(--card);color:var(--muted)}
#settings .seg button.on{background:var(--accent);color:var(--accent-ink)}
#settings .scopenote{font-size:12px;color:var(--muted);margin-left:10px}
#settings .sp{flex:1;font-size:12px;color:var(--muted)}
#settings .presets{display:flex;flex-direction:column;gap:6px;margin:6px 0}
#settings .preset{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--rule);border-radius:9px;cursor:pointer}
#settings .preset:hover{background:var(--code)}
#settings .preset.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
#settings .preset input{margin-top:2px}
#settings .preset .pmeta{flex:1;min-width:0}
#settings .preset .pl{font-weight:600;font-size:13px}
#settings .preset .pt{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Menlo,monospace}
#settings .preset .src{font-size:10px;color:var(--faint);border:1px solid var(--rule);border-radius:5px;padding:1px 6px;flex:none}
#settings .newpreset{display:flex;gap:8px;margin-top:8px}
#settings .newpreset input{flex:none;width:200px}
#settings .preset .pedit{font-size:11px;padding:2px 9px;flex:none}
#settings .peditor{border:1px solid var(--accent);border-radius:9px;padding:11px;margin:4px 0 8px}
#settings .peditor .ptitle{font-size:12px;color:var(--muted);margin-bottom:6px}
#settings .peditor textarea{width:100%;min-height:150px}
#settings .peditor .prow{display:flex;gap:8px;margin-top:8px;align-items:center}
#settings .peditor .prow .sp{flex:1}
#termwrap{position:fixed;z-index:9;background:#111;display:none;flex-direction:column}
#termwrap.open{display:flex}
#termwrap.bottom{left:0;right:0;bottom:0;height:var(--termh,42vh);border-top:2px solid var(--rule)}
#termwrap.right{top:0;right:0;bottom:0;width:var(--termw,40vw);border-left:2px solid var(--rule)}
#termbar{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#181818;color:#aaa;font-size:12px;flex:none}
#termbar .sp{flex:1}
#termbar button{padding:2px 8px;font-size:11px}
#term{flex:1;min-height:0;min-width:0;padding:2px 4px}
#termgrip{position:absolute;z-index:10;touch-action:none}
#termwrap.bottom #termgrip{left:0;right:0;top:-5px;height:10px;cursor:ns-resize}
#termwrap.right #termgrip{top:0;bottom:0;left:-5px;width:10px;cursor:ew-resize}
body.termopen-bottom .wrap{padding-bottom:calc(var(--termh,42vh) + 60px)}
body.termopen-right{padding-right:var(--termw,40vw)}
</style></head><body>
<div class="top">
  <button id="filesbtn" class="iconbtn" title="files">☰</button>
  <div class="dot" id="dot"></div>
  <div class="name" id="fname">ducklab</div>
  <button id="envchip" title="python environment">env</button>
  <span id="memchip"></span>
  <span class="spacer"></span>
  <button id="runall" class="primary">Run All</button>
  <button id="termtoggle">Terminal</button>
  <button id="topmenubtn" class="iconbtn" title="More">⋯</button>
  <button id="helpbtn" class="iconbtn" title="Shortcuts (?)">?</button>
  <button id="settingsbtn" class="iconbtn" title="settings">⚙</button>
  <div id="topmenu">
    <button data-top="restart">↻ Restart kernel</button>
    <button data-top="clearall">⌫ Clear all outputs</button>
    <button data-top="report">▤ Report view</button>
    <button data-top="export">⭳ Export HTML</button>
  </div>
</div>
<div id="runbar"></div>
<div class="wrap" id="cells"></div>
<script>
const FILE = new URLSearchParams(location.search).get("file") || "";
const FQ = FILE ? "?file="+encodeURIComponent(FILE) : "";
let ws, outputs = {};   // cell id -> [out]
let prevIds = null;      // cell ids from the previous render (null = first)
let cellOrder = [];      // cell ids in document order
let cellData = {};       // id -> cell
let selId = null;        // command-mode selected cell
let savedSrc = null;     // source just saved (to locate the cell after re-render)
const $cells = document.getElementById("cells");
const $dot = document.getElementById("dot");

function connect(){
  ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws"+FQ);
  ws.onopen = () => $dot.classList.add("on");
  ws.onclose = () => { $dot.classList.remove("on"); setTimeout(connect, 1500); };
  ws.onmessage = (ev) => handle(JSON.parse(ev.data));
}
function send(m){ if(ws && ws.readyState===1) ws.send(JSON.stringify(m)); }

function handle(m){
  if(m.type==="cells"){
    document.getElementById("fname").textContent = m.file;
    document.title = "ducklab · " + m.file;
    const live = new Set(m.cells.map(c=>c.id));
    for(const k of Object.keys(outputs)) if(!live.has(k)) delete outputs[k];
    const fresh = prevIds ? m.cells.filter(c=>!prevIds.has(c.id)) : [];
    render(m.cells);
    // the AI (or anyone) added/changed a cell: bring the last new one into view
    if(prevIds && fresh.length && Object.keys(editors).length===0){
      const el=document.getElementById("cell-"+fresh[fresh.length-1].id);
      if(el){ el.scrollIntoView({behavior:"smooth", block:"center"}); el.classList.add("flash");
              setTimeout(()=>el.classList.remove("flash"), 1700); }
    }
    cellOrder = m.cells.map(c=>c.id);
    cellData = Object.fromEntries(m.cells.map(c=>[c.id,c]));
    // follow a freshly inserted cell; else keep selection, else default to first
    if(prevIds && fresh.length && Object.keys(editors).length===0) selId = fresh[fresh.length-1].id;
    if(!cellOrder.includes(selId)) selId = cellOrder[0] || null;
    applySel();
    if(savedSrc!==null){
      const hit=m.cells.find(c=>c.source===savedSrc);
      if(hit){ const chip=document.querySelector("#cell-"+hit.id+" .saved");
        if(chip){ chip.classList.add("on"); setTimeout(()=>chip.classList.remove("on"),1400); } }
      savedSrc=null;
    }
    prevIds = live;
  } else if(m.type==="output"){
    (outputs[m.cell] = outputs[m.cell] || []).push(m.out);
    paintOut(m.cell);
  } else if(m.type==="clear"){
    outputs[m.cell] = []; paintOut(m.cell);
  } else if(m.type==="clear_all"){
    for(const k of Object.keys(outputs)){ outputs[k]=[]; paintOut(k); }
  } else if(m.type==="edit_rejected"){
    alert("Edit rejected: " + m.reason);
  } else if(m.type==="status"){
    const el = document.getElementById("cell-"+m.cell);
    if(el){
      el.classList.toggle("busy", m.state==="busy");
      // queued shows only until the run actually starts; busy/idle both end it
      el.classList.toggle("queued", m.state==="queued");
      if(m.state==="busy"){ busyStart[m.cell] = Date.now(); tickBusy();
        el.classList.remove("ok","err","stale");
        if(runAll.active){ el.scrollIntoView({block:"center"}); } }
      else delete busyStart[m.cell];
      if(m.state==="idle"){
        const rb=el.querySelector(".runbadge");
        if(rb && m.elapsed!=null) rb.textContent = m.elapsed<1 ? Math.round(m.elapsed*1000)+"ms" : m.elapsed+"s";
        if(m.status){ el.classList.remove("stale"); el.classList.toggle("ok", m.status==="ok"); el.classList.toggle("err", m.status==="error"); }
        if(m.mem!=null){ const c=document.getElementById("memchip"); c.textContent="🧠 "+m.mem+"MB"; c.classList.add("on"); }
        if(runAll.active){ runAll.done++; updateRunbar(); }
      }
    }
  } else if(m.type==="runall"){
    if(m.state==="start"){ runAll={active:true,total:m.total,done:0}; showRunbar(); }
    else { setTimeout(hideRunbar, 400); runAll.active=false; }
  } else if(m.type==="restore_outputs"){
    for(const [id,arr] of Object.entries(m.outputs)){ outputs[id]=arr; paintOut(id); }
  } else if(m.type==="toast"){
    showToast(m.text);
  }
}

// Elapsed-time ticker for running cells: "running… 12s" beats guessing whether
// anything is happening during a quiet long-running cell.
const busyStart = {};
let runAll = {active:false,total:0,done:0};
const $runbar = () => document.getElementById("runbar");
function showRunbar(){ const b=$runbar(); b.classList.add("on"); b.style.width="0"; }
function updateRunbar(){ const b=$runbar(); const pct=runAll.total?Math.min(100,runAll.done/runAll.total*100):0; b.style.width=pct+"%"; }
function hideRunbar(){ const b=$runbar(); b.classList.remove("on"); b.style.width="0"; }
let busyTimer = null;
function tickBusy(){
  const ids = Object.keys(busyStart);
  for(const id of ids){
    const el = document.querySelector(`#cell-${CSS.escape(id)} .spin .elapsed`);
    if(el) el.textContent = Math.round((Date.now()-busyStart[id])/1000)+"s";
  }
  if(ids.length && !busyTimer) busyTimer = setInterval(tickBusy, 1000);
  if(!ids.length && busyTimer){ clearInterval(busyTimer); busyTimer = null; }
}

const darkMq = window.matchMedia("(prefers-color-scheme: dark)");
function paintCode(el, src){
  el.textContent="";
  if(window.CodeMirror && CodeMirror.runMode){
    el.className = "code" + (darkMq.matches ? " cm-s-dracula" : "");
    CodeMirror.runMode(src, "python", el);
  } else { el.textContent = src; }
}
darkMq.addEventListener && darkMq.addEventListener("change", ()=>{
  document.querySelectorAll("pre.code").forEach(el=>{
    const card = el.closest(".cell"); if(!card) return;
    const src = el.dataset.src || el.textContent; el.dataset.src = src; paintCode(el, src);
  });
});
function render(cells){
  for(const k of Object.keys(editors)) delete editors[k];  // DOM is rebuilt; drop stale editors
  $cells.innerHTML = "";
  for(const c of cells){
    const d = document.createElement("div");
    d.className = "cell"; d.id = "cell-"+c.id;
    d.innerHTML = `
      <div class="chead"><button class="fold" data-fold title="fold">▾</button><span class="idx">${c.idx}</span><span class="runbadge"></span><span class="t">${c.title||('<span class="ln">L'+c.lineno+"</span>")}</span>
        <span class="stalebadge" title="edited since last run">edited</span>
        <span class="saved">✓ saved</span>
        <span class="actions">
          <button data-ask="${c.id}" title="Ask the AI about this cell">AI</button>
          <button data-edit="${c.id}">Edit</button>
          <button data-run="${c.id}">Run</button>
          <button data-menu="${c.id}" title="More">⋯</button>
        </span></div>
      <div class="cellmenu">
        <button data-op="insert-above">↑ Insert above</button>
        <button data-op="insert-below">↓ Insert below</button>
        <button data-op="duplicate">⧉ Duplicate</button>
        <button data-op="md-below">＋ Markdown below</button>
        <div class="sep"></div>
        <button data-op="up">▲ Move up</button>
        <button data-op="down">▼ Move down</button>
        <div class="sep"></div>
        <button data-op="clear">⌫ Clear output</button>
        <button data-op="delete" class="danger">🗑 Delete</button>
      </div>
      <pre class="code"></pre>
      <div class="mdrender"></div>
      <div class="askbar">
        <input type="text" placeholder="Ask the AI about this cell… (Enter = send to terminal, Esc = close)">
        <span class="hint">→ terminal</span>
        <button data-asksend="${c.id}" class="primary">Send</button>
      </div>
      <input class="celltitle" placeholder="# %% cell title (optional)">
      <div class="cm-holder"></div>
      <div class="editbar">
        <button data-save="${c.id}" class="primary">Save</button>
        <button data-saverun="${c.id}">Save &amp; Run</button>
        <button data-cancel="${c.id}">Cancel</button>
        <span style="flex:1"></span><span style="font-size:11px;color:var(--muted)">⌘/Ctrl+Enter = Save &amp; Run</span>
      </div>
      <div class="spin">running… <span class="elapsed"></span>
        <button class="stopbtn" data-stop="${c.id}" title="SIGINT the kernel — the running cell stops with KeyboardInterrupt">■ stop</button></div>
      <div class="qspin">queued… (starts when the cell ahead finishes)</div>
      <div class="outbar" id="outbar-${c.id}"><button data-copy="${c.id}">copy</button><button data-expand="${c.id}">expand</button></div>
      <div class="out" id="out-${c.id}"></div>`;
    if(c.kind==="markdown"){ d.classList.add("mdcell"); d.querySelector(".mdrender").innerHTML = mdToHtml(c.source); }
    const pc = d.querySelector("pre.code"); pc.dataset.src = c.source; paintCode(pc, c.source);
    d.querySelector("[data-run]").onclick = () => send({type:"run", cell:c.id});
    d.querySelector("[data-stop]").onclick = () => send({type:"interrupt"});
    d.querySelector("[data-edit]").onclick = () => openEditor(c);
    d.querySelector("[data-ask]").onclick = () => toggleAsk(c.id);
    d.querySelector("[data-asksend]").onclick = () => sendAsk(c);
    const ai = d.querySelector(".askbar input");
    ai.addEventListener("keydown", (ev)=>{
      if(ev.key==="Enter") sendAsk(c);
      else if(ev.key==="Escape") toggleAsk(c.id, false);
    });
    d.querySelector("[data-save]").onclick = () => saveEditor(c.id, false);
    d.querySelector("[data-saverun]").onclick = () => saveEditor(c.id, true);
    d.querySelector("[data-cancel]").onclick = () => closeEditor(c.id);
    d.addEventListener("mousedown",(ev)=>{ if(!ev.target.closest(".CodeMirror")) selectCell(c.id, false); });
    const menu=d.querySelector(".cellmenu");
    d.querySelector("[data-menu]").onclick=(ev)=>{ ev.stopPropagation();
      const wasOpen=menu.classList.contains("open");
      document.querySelectorAll(".cellmenu.open").forEach(x=>x.classList.remove("open"));
      if(!wasOpen) menu.classList.add("open"); };
    menu.querySelectorAll("[data-op]").forEach(bt=>bt.onclick=(ev)=>{
      ev.stopPropagation(); menu.classList.remove("open"); cellOp(bt.dataset.op, c); });
    d.querySelector("[data-fold]").onclick=(ev)=>{ ev.stopPropagation(); d.classList.toggle("folded"); };
    if(c.status==="ok") d.classList.add("ok");
    else if(c.status==="error") d.classList.add("err");
    if(c.stale) d.classList.add("stale");
    d.querySelector("[data-copy]").onclick=(ev)=>{ ev.stopPropagation();
      const txt=(outputs[c.id]||[]).filter(o=>o.kind!=="image").map(o=>o.kind==="html"?(o.text||""):o.data).join("");
      navigator.clipboard && navigator.clipboard.writeText(txt); showToast("Output copied"); };
    d.querySelector("[data-expand]").onclick=(ev)=>{ ev.stopPropagation();
      const out=d.querySelector(".out"); const on=out.classList.toggle("expanded");
      ev.target.textContent=on?"collapse":"expand"; };
    $cells.appendChild(d);
    paintOut(c.id);
  }
  const add=document.createElement("div"); add.id="addcell";
  add.innerHTML='<button data-addcode title="Add a code cell (b)"><span class="plus">+</span> Add cell</button>'
    +'<button data-addmd title="Add a markdown cell" style="margin-left:8px">+ Markdown</button>';
  add.querySelector("[data-addcode]").onclick=()=>send({type:"insert",cell:"",where:"below"});
  add.querySelector("[data-addmd]").onclick=()=>send({type:"insert",cell:"",where:"below",markdown:true});
  $cells.appendChild(add);
  applySel();
}

function mdToHtml(src){
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")
     .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>")
     .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  const lines=src.split("\n"); let out=[], inList=false, inCode=false, code=[];
  for(const ln of lines){
    if(ln.trim().startsWith("```")){ if(inCode){ out.push("<pre>"+esc(code.join("\n"))+"</pre>"); code=[]; inCode=false; } else inCode=true; continue; }
    if(inCode){ code.push(ln); continue; }
    const m=ln.match(/^(#{1,3})\s+(.*)/);
    if(m){ if(inList){out.push("</ul>");inList=false;} out.push("<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">"); }
    else if(ln.trim().startsWith("- ")){ if(!inList){out.push("<ul>");inList=true;} out.push("<li>"+inline(ln.trim().slice(2))+"</li>"); }
    else if(ln.trim()===""){ if(inList){out.push("</ul>");inList=false;} }
    else { if(inList){out.push("</ul>");inList=false;} out.push("<p>"+inline(ln)+"</p>"); }
  }
  if(inList) out.push("</ul>"); if(inCode) out.push("<pre>"+esc(code.join("\n"))+"</pre>");
  return out.join("");
}
function paintOut(id){
  const box = document.getElementById("out-"+id);
  if(!box) return;
  const outs = outputs[id] || [];
  box.classList.toggle("has", outs.length>0);
  const bar=document.getElementById("outbar-"+id); if(bar) bar.classList.toggle("has", outs.length>0);
  box.innerHTML = "";
  let textBuf = null;
  const flush = () => { if(textBuf){ const p=document.createElement("pre"); p.textContent=textBuf.join(""); box.appendChild(p); textBuf=null; } };
  for(const o of outs){
    if(o.kind==="stream"){ (textBuf = textBuf || []).push(o.data); continue; }
    flush();
    if(o.kind==="image"){ const img=document.createElement("img"); img.src="data:image/png;base64,"+o.data; box.appendChild(img); }
    else if(o.kind==="html"){ const dv=document.createElement("div"); dv.className="rich"; dv.innerHTML=o.data; box.appendChild(dv); }
    else { const p=document.createElement("pre"); if(o.kind==="error") p.className="err"; p.textContent=o.data; box.appendChild(p); }
  }
  flush();
}

// intercept the browser's Save; map Cmd/Ctrl+S to "save open editor(s)"
document.addEventListener("keydown",(e)=>{
  if((e.metaKey||e.ctrlKey) && (e.key==="s"||e.key==="S")){
    e.preventDefault();
    const ids=Object.keys(editors);
    if(ids.length){ ids.forEach(id=>saveEditor(id,false)); showToast("Cell saved"); }
  }
  if((e.metaKey||e.ctrlKey) && (e.key==="z"||e.key==="Z") && !Object.keys(editors).length){
    e.preventDefault(); send({type:"undo"});
  }
  if((e.metaKey||e.ctrlKey) && (e.key==="f"||e.key==="F")){ e.preventDefault(); openFind(); }
  if(e.key==="Escape"){
    if(findbar.classList.contains("open")){ closeFind(); return; }
    if(drawer.classList.contains("open")){ closeDrawer(); return; }
    document.querySelectorAll(".cellmenu.open,#topmenu.open").forEach(x=>x.classList.remove("open"));
  }
}, true);

// ---- command-mode selection + Jupyter-style shortcuts ----
function applySel(){
  document.querySelectorAll(".cell.sel").forEach(el=>el.classList.remove("sel"));
  if(selId){ const el=document.getElementById("cell-"+selId); if(el) el.classList.add("sel"); }
}
function selectCell(id, scroll=true){
  if(!id) return; selId=id; applySel();
  if(scroll){ const el=document.getElementById("cell-"+id); if(el) el.scrollIntoView({block:"nearest"}); }
}
function selectRel(delta){
  if(!cellOrder.length) return;
  let i = cellOrder.indexOf(selId);
  if(i<0) i = 0; else i = Math.max(0, Math.min(cellOrder.length-1, i+delta));
  selectCell(cellOrder[i]);
}
function typingContext(){
  const a=document.activeElement;
  if(a){ const t=a.tagName;
    if(t==="INPUT"||t==="TEXTAREA") return true;
    if(a.closest && (a.closest(".CodeMirror")||a.closest("#termwrap"))) return true; }
  // any editor open counts as edit-mode
  if(Object.keys(editors).length) return true;
  return false;
}
function modalOpen(){
  return ["settings","envmodal","drawer","help"].some(id=>{
    const el=document.getElementById(id); return el && el.classList.contains("open"); });
}
let lastD=0;
document.addEventListener("keydown",(e)=>{
  // help toggle works anywhere except while typing
  if(e.key==="?" && !typingContext()){ e.preventDefault(); toggleHelp(); return; }
  if(e.key==="Escape"){ if(document.getElementById("help").classList.contains("open")){ toggleHelp(false); return; } }
  if(typingContext() || modalOpen()) return;      // edit mode / modal: let inputs handle keys
  if(!selId && cellOrder.length) selId=cellOrder[0];
  const mod = e.metaKey || e.ctrlKey;
  if(e.key==="Enter" && e.shiftKey){ e.preventDefault(); send({type:"run",cell:selId}); selectRel(1); }
  else if(e.key==="Enter" && mod){ e.preventDefault(); send({type:"run",cell:selId}); }
  else if(e.key==="Enter"){ e.preventDefault(); if(cellData[selId]) openEditor(cellData[selId]); }
  else if(e.key==="j"||e.key==="ArrowDown"){ e.preventDefault(); selectRel(1); }
  else if(e.key==="k"||e.key==="ArrowUp"){ e.preventDefault(); selectRel(-1); }
  else if(e.key==="a"){ e.preventDefault(); send({type:"insert",cell:selId,where:"above"}); }
  else if(e.key==="b"){ e.preventDefault(); send({type:"insert",cell:selId,where:"below"}); }
  else if(e.key==="d"){ const now=Date.now(); if(now-lastD<500){ lastD=0;
      if(cellData[selId] && confirm(`Delete cell [${cellData[selId].idx}]?`)) send({type:"delete",cell:selId}); }
      else lastD=now; }
  else if(e.key==="i"){ /* reserved */ }
});

// ---- shortcuts help overlay ----
const help=document.createElement("div"); help.id="help";
help.innerHTML=`<div class="card"><h3>Keyboard shortcuts</h3><table>
  <tr><td class="grp" colspan=2>Command mode (cell selected, not editing)</td></tr>
  <tr><td><kbd>j</kbd> / <kbd>↓</kbd>, <kbd>k</kbd> / <kbd>↑</kbd></td><td>Select next / previous cell</td></tr>
  <tr><td><kbd>Enter</kbd></td><td>Edit selected cell</td></tr>
  <tr><td><kbd>Shift</kbd>+<kbd>Enter</kbd></td><td>Run and select next</td></tr>
  <tr><td><kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>Enter</kbd></td><td>Run in place</td></tr>
  <tr><td><kbd>a</kbd> / <kbd>b</kbd></td><td>Insert cell above / below</td></tr>

</table></div>`;
document.body.appendChild(help);
help.addEventListener("click",(e)=>{ if(e.target===help) toggleHelp(false); });
function toggleHelp(force){ const on = force!==undefined?force:!help.classList.contains("open");
  help.classList.toggle("open", on); }
document.getElementById("helpbtn").onclick=()=>toggleHelp();

function cellOp(op, c){
  if(op==="insert-above") send({type:"insert",cell:c.id,where:"above"});
  else if(op==="insert-below") send({type:"insert",cell:c.id,where:"below"});
  else if(op==="md-below") send({type:"insert",cell:c.id,where:"below",markdown:true});
  else if(op==="duplicate") send({type:"duplicate",cell:c.id});
  else if(op==="up") send({type:"move",cell:c.id,delta:-1});
  else if(op==="down") send({type:"move",cell:c.id,delta:1});
  else if(op==="clear") send({type:"clear_output",cell:c.id});
  else if(op==="delete"){ if(confirm(`Delete cell [${c.idx}] ${c.title||""}?`)){ send({type:"delete",cell:c.id});
      showToast("Cell deleted","Undo",()=>send({type:"undo"})); } }
}
document.addEventListener("click",()=>document.querySelectorAll(".cellmenu.open").forEach(x=>x.classList.remove("open")));
document.getElementById("runall").onclick = () => send({type:"run_all"});
const topmenu=document.getElementById("topmenu");
document.getElementById("topmenubtn").onclick=(ev)=>{ ev.stopPropagation(); topmenu.classList.toggle("open"); };
topmenu.querySelectorAll("[data-top]").forEach(b=>b.onclick=()=>{
  topmenu.classList.remove("open");
  if(b.dataset.top==="restart"){ if(confirm("Restart kernel? All state is lost.")) send({type:"restart"}); }
  else if(b.dataset.top==="report"){ const on=document.body.classList.toggle("report"); localStorage.ducklab_report=on?"1":""; showToast(on?"Report view on":"Report view off"); }
  else if(b.dataset.top==="export"){ window.location = "/api/export"+FQ; }
  else { send({type:"clear_all"}); showToast("All outputs cleared","Undo",()=>send({type:"undo"})); }
});
document.addEventListener("click",()=>topmenu.classList.remove("open"));
async function pollMem(){
  try{
    const d=await (await fetch("/api/kernels")).json();
    const rel=FILE || document.getElementById("fname").textContent;
    const k=d.kernels.find(x=>x.file===rel);
    const chip=document.getElementById("memchip");
    const wasAlive = pollMem._alive;
    if(k && k.alive){ chip.textContent="🧠 "+(k.rss_mb??"?")+"MB"; chip.title="this file's kernel memory · pid "+k.pid; chip.classList.add("on"); pollMem._alive=true; }
    else { chip.textContent="🧠 no kernel"; chip.title="not started yet — first run starts the kernel"; chip.classList.add("on");
      if(wasAlive){ showToast("Kernel died","Restart",()=>send({type:"restart"})); }
      pollMem._alive=false; }
  }catch(_){}
}
setInterval(()=>{ if(!document.hidden) pollMem(); }, 3000);
pollMem();
connect();

// ---- inline cell editor (CodeMirror) ----
const editors = {};   // cell id -> CodeMirror
function openEditor(c){
  const card = document.getElementById("cell-"+c.id);
  if(!card || editors[c.id]) { if(editors[c.id]) editors[c.id].focus(); return; }
  card.classList.add("editing");
  const ti = card.querySelector(".celltitle");
  ti.value = c.title || "";
  ti.style.display = (c.marker===false || c.kind==="markdown") ? "none" : "block";
  ti.onkeydown = (ev)=>{ if(ev.key==="Escape") closeEditor(c.id); };
  const cm = CodeMirror(card.querySelector(".cm-holder"), {
    value: c.source, mode: "python", lineNumbers: true, indentUnit: 4,
    theme: darkMq.matches ? "dracula" : "default",
    viewportMargin: Infinity,
    extraKeys: {"Cmd-Enter": () => saveEditor(c.id, true),
                "Ctrl-Enter": () => saveEditor(c.id, true),
                "Shift-Enter": () => { saveEditor(c.id, true); selectRel(1); },
                "Cmd-S": () => { saveEditor(c.id, false); showToast("Cell saved"); },
                "Ctrl-S": () => { saveEditor(c.id, false); showToast("Cell saved"); },
                "Esc": () => { closeEditor(c.id); const card=document.getElementById("cell-"+c.id); card&&card.focus&&card.focus(); }},
  });
  editors[c.id] = cm; cm.focus();
}
function closeEditor(id){
  const card = document.getElementById("cell-"+id);
  if(card) card.classList.remove("editing");
  if(editors[id]){ editors[id].getWrapperElement().remove(); delete editors[id]; }
}
function saveEditor(id, run){
  if(!editors[id]) return;
  const card=document.getElementById("cell-"+id);
  const ti=card && card.querySelector(".celltitle");
  const msg={type:"edit", cell:id, source: editors[id].getValue(), run: !!run};
  if(ti && ti.style.display!=="none") msg.title = ti.value.trim();
  send(msg);
  closeEditor(id);
  savedSrc = msg.source;
  showToast(run ? "✓ Save and run" : "✓ saved");
}

const toast=document.createElement("div"); toast.id="toast"; document.body.appendChild(toast);
let toastT=null;
function showToast(msg, actLabel, actCb){
  toast.textContent=msg;
  if(actLabel){ const a=document.createElement("span"); a.className="act"; a.textContent=actLabel;
    a.onclick=()=>{ actCb&&actCb(); toast.classList.remove("on"); }; toast.appendChild(a); }
  toast.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove("on"), actLabel?4500:2200); }
function toggleAsk(id, force){
  const card=document.getElementById("cell-"+id); if(!card) return;
  const on = force!==undefined ? force : !card.classList.contains("asking");
  document.querySelectorAll(".cell.asking").forEach(el=>el.classList.remove("asking"));
  if(on){ card.classList.add("asking"); card.querySelector(".askbar input").focus(); }
}
function termWrite(text){ if(tws && tws.readyState===1){ tws.send(JSON.stringify({type:"in",data:text})); return true; } return false; }
function sendAsk(c){
  const card=document.getElementById("cell-"+c.id); if(!card) return;
  const inp=card.querySelector(".askbar input");
  const text=inp.value.trim(); if(!text) return;
  const label=c.title || ("L"+c.lineno);
  const msg=`On cell [${c.idx}] "${label}": ${text}`;
  const deliver=()=>{ termWrite(msg + "\r"); showToast("Sent to the AI in the terminal"); };
  if(termWrite("")) { deliver(); }
  else { // terminal closed: open it, then send once the agent has had time to start
    openTerm(); showToast("Opening terminal… will send shortly");
    setTimeout(deliver, 5000);
  }
  inp.value=""; toggleAsk(c.id, false);
}

  termwrap.classList.remove("bottom","right"); termwrap.classList.add(dock);
  document.body.classList.remove("termopen-bottom","termopen-right");
  if(termwrap.classList.contains("open"))
    document.body.classList.add(dock==="bottom"?"termopen-bottom":"termopen-right");
  const h=localStorage.ducklab_termh, w=localStorage.ducklab_termw;
  if(h) document.documentElement.style.setProperty("--termh", h+"px");
  if(w) document.documentElement.style.setProperty("--termw", w+"px");
  document.getElementById("termdock").textContent = dock==="bottom" ? "⇥ Right" : "⇩ Bottom";
  if(fit) requestAnimationFrame(()=>fit.fit());
}
function openTerm(){
  termwrap.classList.add("open"); applyDock();
  if(term){ fit.fit(); term.focus(); return; }
  term=new Terminal({fontSize:13,fontFamily:"Menlo,monospace",theme:{background:"#111"},allowProposedApi:true});
  fit=new FitAddon.FitAddon(); term.loadAddon(fit);
  try{ if(window.Unicode11Addon){ term.loadAddon(new Unicode11Addon.Unicode11Addon()); term.unicode.activeVersion="11"; } }catch(_){}
  term.open(document.getElementById("term")); fit.fit();
  tws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws/term"+FQ);
  tws.onmessage=(e)=>term.write(e.data);
  tws.onopen=()=>tws.send(JSON.stringify({type:"resize",cols:term.cols,rows:term.rows}));
  tws.onclose=()=>term.write("\r\n[disconnected]\r\n");
  term.onData(d=>{ if(tws.readyState===1) tws.send(JSON.stringify({type:"in",data:d})); });
  term.onResize(({cols,rows})=>{ if(tws.readyState===1) tws.send(JSON.stringify({type:"resize",cols,rows})); });
  window.addEventListener("resize",()=>{ if(termwrap.classList.contains("open")) fit.fit(); });
  term.focus();
}
function closeTerm(){ termwrap.classList.remove("open");
  document.body.classList.remove("termopen-bottom","termopen-right"); }
document.getElementById("termtoggle").onclick=()=>termwrap.classList.contains("open")?closeTerm():openTerm();
termwrap.addEventListener("click",async(e)=>{
  if(e.target.id==="termclose") closeTerm();
  else if(e.target.id==="termkill"){
    if(!confirm("Kill the terminal session? The running agent is terminated too.")) return;
    await fetch("/api/terminals/close",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({file:FILE||null})});
    try{ tws&&tws.close(); }catch(_){}
    if(term){ term.dispose(); term=null; } tws=null; fit=null;
    closeTerm(); showToast("Terminal session killed");
  }
  else if(e.target.id==="termdock"){ dock = dock==="bottom" ? "right" : "bottom";
    localStorage.ducklab_dock = dock; applyDock(); }
});
// drag-resize (pointer events: mouse + touch)
const grip=document.getElementById("termgrip");
grip.addEventListener("pointerdown",(e)=>{
  e.preventDefault(); grip.setPointerCapture(e.pointerId);
  const move=(ev)=>{
    if(dock==="bottom"){
      const px=Math.min(Math.max(window.innerHeight-ev.clientY,120), window.innerHeight-120);
      localStorage.ducklab_termh=px|0;
      document.documentElement.style.setProperty("--termh",(px|0)+"px");
    }else{
      const px=Math.min(Math.max(window.innerWidth-ev.clientX,280), window.innerWidth-320);
      localStorage.ducklab_termw=px|0;
      document.documentElement.style.setProperty("--termw",(px|0)+"px");
    }
    if(fit) requestAnimationFrame(()=>fit.fit());
  };
  const up=()=>{ grip.removeEventListener("pointermove",move); grip.removeEventListener("pointerup",up); };
  grip.addEventListener("pointermove",move); grip.addEventListener("pointerup",up);
});
</script>
